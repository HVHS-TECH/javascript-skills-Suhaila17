<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird - AI Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <h1>Flappy Bird</h1>
    <p>Press Space, Click, or Tap to flap.</p>
    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="400" height="600"></canvas>
      <div class="game-hud" id="gameHud">
        <div class="hud-row">
          <span id="hudScore">Score: 0</span>
          <button id="hudResetButton" class="small-button">Reset</button>
        </div>
        <p id="hudMessage">Focus on the gap and keep flapping!</p>
      </div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">Flappy Bird</h2>
          <p id="overlayText">Press Space, Click, or Tap to start.</p>
          <button id="overlayButton" class="primary-button">Start</button>
          <p id="bestScoreText">Best: 0</p>
        </div>
      </div>
    </div>
    <div class="scoreboard">
      <div class="score-row">
        <span id="scoreLabel">Score: 0</span>
        <span id="bestLabel">High Score: 0</span>
      </div>
      <div class="score-row">
        <span id="messages">Ready?</span>
        <button id="resetButton" class="small-button">Reset</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
